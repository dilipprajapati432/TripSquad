  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Back orbit arc -->
  <ellipse cx="50" cy="62" rx="33" ry="9" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2.8" clip-path="url(#back)"/>
  <!-- Map pin -->
  <path d="M50 18 C39 18 31 26 31 36 C31 49 50 66 50 66 C50 66 69 49 69 36 C69 26 61 18 50 18 Z" fill="#ffffff"/>

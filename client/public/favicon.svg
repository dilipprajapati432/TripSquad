<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a9e8f"/>
      <stop offset="100%" stop-color="#0d7a6e"/>
    </linearGradient>
    <clipPath id="front">
      <rect x="0" y="54" width="100" height="46"/>

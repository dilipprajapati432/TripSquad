  <!-- Waypoint dots -->
  <circle cx="17" cy="60" r="3.2" fill="#ffffff"/>
  <circle cx="50" cy="71" r="4.2" fill="#E8603C"/>
  <circle cx="83" cy="60" r="3.2" fill="#ffffff"/>
